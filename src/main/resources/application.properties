spring.application.name=travel-planner

# Database connection (matches the Docker container from before)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=devpass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=change-this-dev-only-secret-must-be-at-least-256-bits-long-for-hs256
app.jwt.expiration-ms=86400000

# API keys
OPENTRIPMAP_API_KEY=${OPENTRIPMAP_API_KEY}
GEMINI_API_KEY=${GEMINI_API_KEY}


# Switched from gemini-flash-latest (flagship Flash, currently "thinking"-enabled) to
# the Flash-Lite tier after live-diagnosing repeated 503 UNAVAILABLE ("high demand")
# Accepted tradeoff: a lite model is somewhat less nuanced at
# following complex prompt instructions than flagship Flash, but this app's
# correctness never actually depends on that
app.llm.chat-model=gemini-flash-lite-latest

# Base URL of the React frontend, used to build verification/reset links sent by
# email. Kept configurable rather than hard-coded so a deployed build only needs a property change, not a code change.
app.frontend.base-url=http://localhost:5173

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true